<style>
:root{--bg:#050816;--tx:#e8f0ff;--mu:#9aa8c7;--ga:rgba(255,255,255,.16);--gb:rgba(255,255,255,.04);--bd:rgba(255,255,255,.24);--ac:#5ef2ff;--ac2:#8b7bff;--ok:#5dffb0;--no:#ff6b8b;--sh:rgba(0,0,0,.45);--o1:#2a6bff;--o2:#9b5cff;--o3:#00e0c6;--cd:rgba(0,0,0,.35);box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#e6eeff;--tx:#0d1b3d;--mu:#4a5b82;--ga:rgba(255,255,255,.8);--gb:rgba(255,255,255,.35);--bd:rgba(255,255,255,.95);--ac:#0069b3;--ac2:#5b3df5;--ok:#007a50;--no:#c9163f;--sh:rgba(40,70,140,.25);--cd:rgba(13,27,61,.07)}}
:root[data-theme=light]{--bg:#e6eeff;--tx:#0d1b3d;--mu:#4a5b82;--ga:rgba(255,255,255,.8);--gb:rgba(255,255,255,.35);--bd:rgba(255,255,255,.95);--ac:#0069b3;--ac2:#5b3df5;--ok:#007a50;--no:#c9163f;--sh:rgba(40,70,140,.25);--cd:rgba(13,27,61,.07)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--tx);font:400 16px/1.5 "Space Grotesk",system-ui,sans-serif}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;background-image:linear-gradient(rgba(94,242,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(94,242,255,.07) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%)}
.o{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:dr 22s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:var(--o1);top:-90px;left:-90px}
.o2{width:300px;height:300px;background:var(--o2);bottom:4%;right:-90px;animation-delay:-8s}
.o3{width:220px;height:220px;background:var(--o3);top:46%;left:28%;opacity:.3;animation-delay:-14s}
@keyframes dr{to{transform:translate(60px,-50px) scale(1.2)}}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:14px}
.mono,code,h1{font-family:"JetBrains Mono",ui-monospace,monospace}
h1{font-size:clamp(17px,4.6vw,24px);margin:6px 2px 2px;font-weight:700;color:var(--ac)}
h1 span{display:block;font-size:.62em;font-weight:500;color:var(--ok)}.lg{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.3em;margin-right:.28em}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:3px;background:var(--ac);vertical-align:-.15em;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.g{background:linear-gradient(135deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--bd);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -10px 24px rgba(255,255,255,.04),0 24px 60px var(--sh);position:relative;overflow:hidden}
.g::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(120% 60% at 18% -10%,rgba(255,255,255,.26),transparent 55%);pointer-events:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 6px;border-radius:999px;font:600 14px "Space Grotesk",sans-serif;cursor:pointer;position:relative}
.seg{position:relative}.seg button{z-index:1}.seg .on{color:var(--ac);font-weight:700}.seg .pill{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;pointer-events:none;background:linear-gradient(135deg,rgba(94,242,255,.38),rgba(139,123,255,.38));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 20px rgba(94,242,255,.35);transition:transform .5s cubic-bezier(.34,1.35,.5,1),width .5s cubic-bezier(.34,1.35,.5,1)}@media (prefers-reduced-motion:reduce){.seg .pill{transition:none}}
button:focus-visible,summary:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pr{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mu);padding:0 6px}
.bar{flex:1;height:8px;border-radius:9px;background:var(--cd);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 14px var(--ac);transition:width .5s}
.card{min-height:350px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer}
.pop{animation:fl .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fl{from{transform:rotateY(80deg) scale(.96);opacity:.2}to{transform:none;opacity:1}}
.k{font-size:13px;color:var(--mu);margin-top:6px}
.big{font:700 clamp(19px,5.4vw,28px)/1.25 "JetBrains Mono",monospace;word-break:break-word;color:var(--ac)}
.hint{color:var(--mu);font-size:14px;margin-top:8px}
p{margin:0}
code{display:block;font-size:13px;line-height:1.5;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;word-break:break-all;color:var(--ac)}
.row{display:flex;gap:10px}
.b{flex:1;padding:14px 10px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(135deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--tx);font:600 15px "Space Grotesk",sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.b:active{transform:scale(.97)}
.b.ok{color:var(--ok)}.b.no{color:var(--no)}.b.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 16px var(--ac)}
.q{padding:22px;display:grid;gap:12px}
.opt{text-align:left;font-family:"JetBrains Mono",monospace;font-size:14px;word-break:break-word}
.opt.ok{border-color:var(--ok);box-shadow:0 0 18px var(--ok)}.opt.no{border-color:var(--no);box-shadow:0 0 18px var(--no)}
input{width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:16px "Space Grotesk",sans-serif}
details{padding:14px 16px}
summary{cursor:pointer;font:600 14px "JetBrains Mono",monospace;color:var(--ac);word-break:break-word}
details>*+*{margin-top:9px}
.sc{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
@media(prefers-reduced-motion:reduce){.o,.cur,.pop{animation:none}.bar i{transition:none}}
.o{filter:none;will-change:transform}.o1{width:440px;height:440px;background:radial-gradient(circle,var(--o1),transparent 68%)}.o2{width:400px;height:400px;background:radial-gradient(circle,var(--o2),transparent 68%)}.o3{width:300px;height:300px;background:radial-gradient(circle,var(--o3),transparent 68%)}
.b{-webkit-backdrop-filter:none;backdrop-filter:none}
details.g{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);content-visibility:auto;contain-intrinsic-size:auto 56px}
button,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
code{white-space:pre-wrap}.col{display:grid;gap:14px}#pg:empty{display:none}
.gh{font:600 15px 'Space Grotesk',sans-serif;color:var(--ac2);margin:8px 4px 0}
.seg button{padding:10px 2px;font-size:13px}.pr span{white-space:nowrap}
.rs{border:1px solid var(--bd);background:var(--cd);color:var(--mu);border-radius:999px;padding:6px 12px;font:600 12px 'Space Grotesk',sans-serif;cursor:pointer;white-space:nowrap}.cf{color:var(--no);border-color:var(--no)}
#sp{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,rgba(94,242,255,.14),transparent 60%),var(--bg);transition:opacity .45s}#sp.out{opacity:0;pointer-events:none}
.spc{width:min(340px,100%);padding:28px 24px;display:grid;gap:14px;text-align:center}.pcn{font-size:56px;font-weight:700;color:var(--ac);text-shadow:0 0 24px var(--ac)}.sm{color:var(--mu);font-size:14px;min-height:21px}#sb{width:100%;transform:scaleX(0);transform-origin:left;transition:none}
.sc{flex-wrap:wrap;gap:6px}textarea{width:100%;min-height:90px;padding:12px;border-radius:16px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:13px 'JetBrains Mono',monospace;resize:vertical}.bm{font-size:13px;color:var(--mu);min-height:19px}
#sp{cursor:pointer}
.seg{flex-wrap:wrap;border-radius:26px}.seg button{flex:1 1 auto;padding:10px}.nt{margin-top:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--ok);background:linear-gradient(135deg,rgba(93,255,176,.16),rgba(94,242,255,.1));font-size:13px;line-height:1.45}
.tm{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;height:260px;overflow:auto;contain:strict;font:13px/1.45 monospace;user-select:text;-webkit-user-select:text}.tm div{white-space:pre-wrap;word-break:break-word}.tm div:first-child{color:var(--ac2)}body.kb .o{display:none!important}body.kb *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;transition:none!important;animation:none!important}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}button,a,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}input,textarea,select{font-size:16px;-webkit-appearance:none;appearance:none}button{font-family:inherit}</style></head><body>

<script>
const D=[
["Include /etc/ssh/sshd_config.d/*.conf","Carga archivos adicionales que coincidan con el patrón; separa ajustes por finalidad y paquetes. El orden importa: para muchas opciones OpenSSH usa el primer valor obtenido, no el último.","Mantener configuración modular; revisar todos los archivos incluidos.","sudo grep -RniE '^[[:space:]]*(Include|Port|PasswordAuthentication|PermitRootLogin)' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/"],
["Port 22","Define el puerto TCP del servidor; se pueden declarar varios Port. Cambiarlo exige ajustar cliente y firewall y no añade cifrado.","Dejar 22 en un laboratorio LAN salvo razón operativa concreta.","sudo ss -tlnp | grep ':22'"],
["AddressFamily any","Permite IPv4 e IPv6 si están disponibles. inet limita a IPv4; inet6 a IPv6.","any suele ser apropiado; limitar solo conscientemente."],
["ListenAddress","Direcciones locales donde escucha sshd. 0.0.0.0 = todas las IPv4; :: = IPv6. Sin especificar, escucha en todas las disponibles.","No fijar una IP si cambia por DHCP; restringir solo si la topología lo exige.","sudo ss -ltnp | grep sshd"],
["HostKey","Claves privadas de identidad del servidor (ej. /etc/ssh/ssh_host_ed25519_key); no son las claves personales del usuario. Demuestran la identidad del servidor al cliente.","No compartir claves privadas de host; las públicas sí se pueden distribuir.","sudo ls -l /etc/ssh/ssh_host_*"],
["RekeyLimit","Limita datos y/o tiempo tras los que se renegocian las claves de sesión. default usa los valores internos de OpenSSH.","Conservar el predeterminado salvo requisito específico."],
["SyslogFacility AUTH","Categoría usada para registrar eventos de sshd; puede aparecer AUTHPRIV según plataforma.","Sirve para clasificar registros de autenticación.","sudo journalctl -u ssh"],
["LogLevel INFO","Cantidad de detalle que registra sshd. Más detalle ayuda a diagnosticar, pero genera más registros.","INFO para uso normal; subir temporalmente si se investiga un fallo."],
["LoginGraceTime 2m","Tiempo máximo para completar la autenticación antes de cerrar la conexión. 2m = dos minutos.","Evita conexiones sin autenticar indefinidas; no es la duración de una sesión ya iniciada."],
["PermitRootLogin prohibit-password","Controla el acceso SSH directo de root. prohibit-password impide contraseña e interactiva, pero permite claves públicas autorizadas. no prohíbe el inicio directo.","Entrar con usuario personal y usar sudo; PermitRootLogin no es la política estricta habitual."],
["StrictModes yes","Comprueba propietario y permisos de los archivos de autenticación (claves autorizadas) y rechaza situaciones inseguras.","Mantener yes; ~/.ssh en 700 y authorized_keys en 600.","sudo sshd -T | grep '^strictmodes'; ls -ld ~/.ssh; ls -l ~/.ssh/authorized_keys"],
["MaxAuthTries 6","Limita intentos de autenticación por conexión. No es un límite global por minuto ni sustituye otros controles contra fuerza bruta.","3 reduce intentos por conexión, pero no reemplaza claves, firewall ni monitoreo."],
["MaxSessions 10","Limita sesiones shell/login/subsistema multiplexadas por conexión de red autenticada; no es el total de usuarios ni de conexiones TCP.","El valor por defecto suele bastar en laboratorio."],
["PubkeyAuthentication yes","Autenticación por clave pública: el cliente demuestra que posee la clave privada de una clave pública autorizada.","Habilitar y probar una clave antes de desactivar contraseñas."],
["AuthorizedKeysFile","Dónde busca sshd las claves públicas autorizadas; habitualmente .ssh/authorized_keys en el directorio personal.","No es la clave privada: contiene claves públicas autorizadas para entrar.","sudo sshd -T | grep '^authorizedkeysfile'; cat ~/.ssh/authorized_keys"],
["HostbasedAuthentication no","Desactiva la autenticación basada en la confianza del host cliente; no es la clave de host del servidor.","Mantener desactivada en un laboratorio sencillo."],
["IgnoreRhosts yes","Ignora los archivos legacy .rhosts y .shosts.","Mantener yes para evitar confianza basada en esos archivos."],
["PasswordAuthentication yes","Permite autenticar con contraseña. Viaja dentro del canal SSH protegido, no en texto plano.","Práctico para empezar; al endurecer, probar clave pública y luego valorar no."],
["PermitEmptyPasswords no","Prohíbe la autenticación por contraseña a cuentas con contraseña vacía; no crea contraseñas ni sustituye políticas de cuentas.","Mantener no."],
["KbdInteractiveAuthentication no","Desactiva keyboard-interactive, que presenta desafíos vía PAM u otros mecanismos. Distinto de PasswordAuthentication aunque parezca similar.","Mantener no salvo que se use un mecanismo interactivo/2FA; revisar PAM antes de cambiarlo."],
["KerberosAuthentication","Autenticación basada en Kerberos cuando la infraestructura está configurada (dominios/entornos centralizados).","No suele ser necesario en un laboratorio doméstico aislado."],
["GSSAPIAuthentication","Métodos GSSAPI, usados en integraciones como Kerberos y ciertos escenarios de inicio de sesión único.","Deshabilitado habitualmente si no hay integración corporativa."],
["UsePAM yes","Integra sshd con PAM: autenticación, controles de cuenta, límites y sesión. El efecto depende de los módulos PAM instalados.","En Debian se mantiene yes; no deshabilitar sin comprender las consecuencias.","sudo sshd -T | grep '^usepam'; cat /etc/pam.d/sshd"],
["X11Forwarding yes","Reenvía aplicaciones X11 por SSH si cliente, servidor y entorno gráfico lo soportan; no controla todo GNOME remotamente.","Deshabilitar si no se necesita; por terminal no es necesario."],
["PrintMotd no","Controla si sshd imprime /etc/motd al iniciar sesión. Con PAM, el mensaje puede gestionarlo PAM.","Si se quiere bienvenida, revisar cómo se configura MOTD/banner para evitar duplicados.","sudo sshd -T | grep '^printmotd'; cat /etc/motd"],
["AcceptEnv LANG LC_* COLORTERM NO_COLOR","Permite que el cliente envíe variables de entorno cuyos nombres coincidan con esos patrones; no acepta cualquier variable.","Facilita idioma, localización y color de terminal; no es autenticación."],
["Subsystem sftp /usr/lib/openssh/sftp-server","Asocia el subsistema SFTP con el programa que lo implementa. SFTP lista, descarga y sube archivos sobre SSH; no es el FTP tradicional.","Conservar una definición válida para que el cliente sftp funcione.","sudo sshd -T | grep '^subsystem'; sftp adpc@192.168.0.58"],
["Banner /ruta/al/archivo","Muestra un texto de aviso antes de la autenticación si está configurado y el archivo es legible. MOTD se muestra después de iniciar sesión.","Crear un aviso breve y legal; probar en una conexión nueva."]];
const C=[
["ip a","Muestra interfaces, estado y direcciones IP. Buscar inet 192.168.0.58/… en la interfaz activa."],
["ip route","Muestra rutas IPv4; ayuda a verificar la ruta predeterminada y las redes conectadas."],
["ping 192.168.0.58","Desde Windows: comprueba conectividad ICMP si el firewall responde. Que falle no prueba que SSH esté caído."],
["Test-NetConnection 192.168.0.58 -Port 22","En PowerShell prueba TCP al puerto 22. TcpTestSucceeded : True indica que se estableció TCP."],
["sudo systemctl status ssh","Muestra estado, PID y mensajes recientes del servicio."],
["sudo systemctl enable --now ssh","Habilita el servicio al arrancar y lo inicia ahora. Solo si hace falta habilitar/iniciar."],
["sudo ss -tlnp | grep ':22'","Sockets TCP en escucha, con direcciones y proceso (si hay permisos)."],
["sudo sshd -t","Valida la configuración; ejecutar antes de reiniciar tras editar."],
["sudo sshd -T","Consulta la configuración efectiva."],
["sudo journalctl -u ssh -f","Sigue en vivo los registros de SSH. Ctrl+C detiene la vista sin cerrar la sesión SSH."],
["whoami","Muestra el usuario efectivo de la shell actual."],
["hostname","Muestra el nombre de host del sistema donde se ejecuta."],
["hostname -I","Muestra las direcciones IP del equipo; puede listar más de una."],
["uname -a","Muestra kernel, nombre de sistema y arquitectura/datos de compilación."],
["echo $SSH_CONNECTION","En una shell remota: IP cliente, puerto cliente, IP servidor y puerto servidor."],
["sftp adpc@192.168.0.58","Abre una sesión interactiva de transferencia de archivos mediante SFTP."]];

const M=[
[`cat /etc/debian_version`,`Muestra el número de versión de Debian instalado.`,`abc`],
[`lsb_release -a`,`Muestra distribuidor, versión y nombre en clave (paquete lsb-release).`,`abc`],
[`hostnamectl`,`Resume nombre del equipo, sistema operativo, kernel y arquitectura.`,`abc`],
[`uname -r`,`Versión del kernel en uso.`,`abc`,`Resultado: serie 5.10 en Debian 11, 6.1 en 12 y 6.12 en 13.`],
[`ssh -V`,`Versión de OpenSSH del cliente.`,`abc`,`Resultado: 8.4p1 en Debian 11, 9.2p1 en 12 y 10.0p1 en 13.`],
[`sudo apt update`,`Descarga los índices de paquetes de los repositorios configurados; no instala nada.`,`abc`],
[`sudo apt upgrade --without-new-pkgs`,`Actualización mínima: solo paquetes que no requieren instalar ni quitar otros. Primer paso antes de cambiar de versión.`,`abc`],
[`sudo apt full-upgrade`,`Actualiza todo el sistema resolviendo dependencias; es el paso principal al subir de versión.`,`abc`],
[`sudo apt autoremove`,`Quita las dependencias automáticas que ya no hacen falta.`,`abc`],
[`apt-mark showhold`,`Lista paquetes retenidos, que pueden bloquear una actualización.`,`abc`],
[`dpkg --audit`,`Muestra paquetes Half-Installed o con error de configuración; se revisa antes de actualizar.`,`abc`],
[`dpkg --get-selections '*'`,`Lista el estado de todos los paquetes; se guarda como respaldo antes de actualizar.`,`abc`],
[`sudo dpkg --configure --pending`,`Termina de configurar paquetes que quedaron a medias.`,`abc`],

11:{h:`Lanzada el 14 de agosto de 2021. Su soporte LTS terminó el 31 de agosto de 2026: Debian ya no publica actualizaciones de seguridad para esta versión (solo un subconjunto de paquetes tiene soporte externo, Extended LTS). Lo recomendable es migrar a Debian 12 y después a 13.`,s:[[`Software principal`,`Kernel Linux 5.10, OpenSSH 8.4p1, GCC 10.2, MariaDB 10.5 y GIMP 2.10.22. Incluyó más de 11.000 paquetes nuevos, hasta superar los 59.000 en total.`],[`Novedades de su época`,`Fue la primera con un kernel que incluye soporte exFAT, activó por defecto el journal persistente de systemd (los registros sobreviven al reinicio y se leen con journalctl) y añadió un comando genérico open.`],[`Repositorios y seguridad`,`El suite de seguridad pasó a llamarse bullseye-security. Todavía no existe el componente non-free-firmware, que llegó con Debian 12.`],[`Cómo migrar`,`Ruta 11 → 12 → 13, sin saltarse versiones. Respalda /etc, /var/lib/dpkg y la salida de dpkg --get-selections '*'; cambia las fuentes a bookworm, añade non-free-firmware si usas firmware no libre y ejecuta apt update, apt upgrade --without-new-pkgs y apt full-upgrade.`]]},
12:{h:`Lanzada el 10 de junio de 2023. El soporte regular terminó el 12 de julio de 2026 y ahora está en LTS hasta el 30 de junio de 2028, para amd64, i386, arm64, armhf y ppc64el.`,s:[[`Software principal`,`Kernel 6.1, OpenSSH 9.2p1, GCC 12.2, systemd 252, Python 3.11, Bash 5.2.15, APT 2.6, dpkg 1.21.22 y PHP 8.2.`],[`Firmware no libre`,`Se creó el componente non-free-firmware para separar el firmware de los demás paquetes non-free. Al subir desde 11 conviene añadirlo a las fuentes APT si usas firmware no libre; las ISO y el instalador pueden incluirlo.`],[`Registros`,`rsyslog crea menos archivos de log y usa marcas de tiempo de alta precisión; para consultar servicios se recomienda journalctl.`],[`Cómo migrar a 13`,`Solo se admite subir desde 12 con el último punto de versión. Si actualizas por SSH, primero sube OpenSSH a 1:9.2p1-2+deb12u7 o superior y trabaja dentro de tmux o screen. Debian 13 pide revisar /boot (mínimo 768 MB con unos 300 MB libres), pasar las fuentes al formato deb822 y reiniciar al final por el cambio de kernel.`]]},
13:{h:`Es la versión estable actual. Sus notas de publicación oficiales son la base de este apartado, incluidas las tarjetas de directivas y comandos SSH.`,s:[[`Software principal`,`Kernel 6.12, OpenSSH 10.0p1, GCC 14.2, systemd 257, Python 3.13, Bash 5.2.37, curl 8.14.1, PostgreSQL 17, GNOME 48 y KDE Plasma 6.3. Más de 14.000 paquetes nuevos, con un total superior a 69.000.`],[`Arquitecturas`,`Soporte oficial de riscv64 por primera vez. i386 queda solo para ejecutar software antiguo, sin kernel ni instalador; armel es su última versión; mipsel y mips64el se eliminan. Todas las arquitecturas excepto i386 usan time_t de 64 bits.`],[`Cambios del día a día`,`/tmp es un tmpfs en memoria (hasta el 50 % de la RAM como máximo). last, lastb y lastlog se reemplazan por wtmpdb, lastlog2 y lslogins. systemd-sysctl ya no lee /etc/sysctl.conf: usa /etc/sysctl.d/*.conf. ping ya no corre con privilegios elevados. En instalaciones nuevas, /tmp y /var/tmp se limpian periódicamente.`],[`APT y OpenSSH`,`APT migra al formato deb822 (.sources) y trae apt modernize-sources; se recomienda usar .pgp en Signed-By. OpenSSH ya no admite claves DSA ni con opciones de configuración, openssh-server no lee ~/.pam_environment y la autenticación GSSAPI saldrá del paquete principal en forky.`]]}};

const L=[
[`Fundamentos`,`Todo es un archivo`,`En Linux, dispositivos, procesos y sockets se exponen como archivos. /etc guarda la configuración, /var/log los registros, /home los datos de usuarios y /proc el estado del kernel.`,`ls /etc /var/log /proc | head`],
[`Fundamentos`,`Manuales y ayuda`,`man abre el manual de un comando; el número es la sección (5 = archivos de configuración, 8 = administración). --help da un resumen rápido.`,`man 5 sshd_config`],
[`Fundamentos`,`Tuberías y redirección`,`| envía la salida de un comando al siguiente; > sobrescribe un archivo y >> añade al final. grep filtra líneas, wc cuenta y tail -f sigue un archivo en vivo.`,`sudo sshd -T | wc -l`],
[`Usuarios y permisos`,`Permisos rwx`,`Cada archivo tiene permisos para propietario, grupo y otros: r=4, w=2, x=1. 700 en ~/.ssh y 600 en authorized_keys deja el acceso solo al propietario. chmod cambia permisos y chown el propietario.`,`chmod 700 ~/.ssh; ls -ld ~/.ssh`],
[`Usuarios y permisos`,`Usuarios, grupos y sudo`,`/etc/passwd lista las cuentas y /etc/group los grupos. sudo ejecuta comandos con privilegios según /etc/sudoers, que se edita con visudo. id muestra tu UID y tus grupos.`,`id; groups`],
[`Sistema`,`systemd y servicios`,`systemd arranca y supervisa los servicios. systemctl los gestiona (start, stop, restart, reload, enable, disable, status). enabled significa que arranca con el sistema; active, que corre ahora.`,`systemctl is-enabled ssh; systemctl is-active ssh`],
[`Sistema`,`journalctl y registros`,`journald guarda los registros de systemd. Filtra por unidad (-u), tiempo (--since) o prioridad (-p). Un /var/log/auth.log clásico solo existe si rsyslog está instalado.`,`sudo journalctl -u ssh --since '1 hour ago'`],
[`Sistema`,`Paquetes con apt`,`apt instala, actualiza y elimina paquetes de los repositorios de Debian. Mantener el sistema al día es una de las defensas más importantes, también para openssh-server.`,`sudo apt update && sudo apt upgrade`],
[`Red`,`Direcciones, rutas y sockets`,`ip a y ip route muestran direcciones y rutas; ss lista sockets. Una IP con /24 usa la máscara 255.255.255.0: 256 direcciones en la subred.`,`ip -br a; ss -tuln`],
[`Red`,`Firewall: ufw y nftables`,`nftables es el marco de filtrado de Debian; ufw es una capa sencilla encima. Política típica: denegar la entrada por defecto y permitir solo lo necesario, como 22/tcp.`,`sudo ufw status verbose`],
[`SSH avanzado`,`Bloques Match`,`Match en sshd_config aplica directivas solo a ciertos usuarios, grupos o direcciones, por ejemplo permitir contraseña solo desde la LAN. sshd -T -C muestra los valores efectivos para un contexto.`,`sudo sshd -T -C user=adpc,host=debian,addr=192.168.0.10`],
[`SSH avanzado`,`Archivo ~/.ssh/config`,`En el cliente define alias con Host, HostName, User, Port e IdentityFile, para escribir solo ssh debian. Es configuración del cliente, no de sshd.`,`Host debian\n  HostName 192.168.0.58\n  User adpc`],
[`SSH avanzado`,`ssh-agent y huellas`,`ssh-agent mantiene tu clave privada descifrada en memoria para no escribir la frase cada vez. ssh-keygen -lf muestra la huella de una clave y ssh-keyscan obtiene las claves de host de un servidor.`,`ssh-keygen -lf ~/.ssh/id_ed25519.pub`],
[`SSH avanzado`,`Túneles y reenvío de puertos`,`-L reenvía un puerto local hacia un destino a través del servidor; -R hace lo inverso; -D abre un proxy SOCKS. Dependen de AllowTcpForwarding en sshd. -J (ProxyJump) salta por un host intermedio.`,`ssh -L 8080:localhost:80 adpc@192.168.0.58`],
[`Herramientas`,`scp, rsync y tmux`,`scp copia archivos por SSH; rsync sincroniza y transfiere solo las diferencias; tmux mantiene tus comandos corriendo aunque se corte la conexión y puedes volver con tmux attach.`,`rsync -avz carpeta/ adpc@192.168.0.58:~/respaldo/`],
[`Herramientas`,`fail2ban`,`Lee los registros y bloquea temporalmente las IP con muchos intentos fallidos. Se combina con claves públicas, AllowUsers, firewall y actualizaciones: ninguna medida basta por sí sola.`,`sudo apt install fail2ban`]];
const AP=[
[`Fundamentos`,`apt, apt-get y dpkg`,`apt es la interfaz moderna para uso interactivo. apt-get y apt-cache son las clásicas, con salida estable para scripts. dpkg es la herramienta de bajo nivel: instala cada .deb pero no resuelve dependencias.`,`apt --version; dpkg -S /usr/sbin/sshd`],
[`Fundamentos`,`Dónde guarda las cosas`,`/etc/apt: configuración y fuentes. /var/lib/apt/lists: índices descargados. /var/cache/apt/archives: .deb descargados. /var/log/apt: historial. /var/log/dpkg.log: acciones de dpkg.`,`ls /etc/apt /var/log/apt`],
[`Instalar y actualizar`,`update, upgrade y full-upgrade`,`update solo descarga los índices. upgrade instala versiones nuevas de lo ya instalado, puede traer dependencias nuevas y nunca elimina paquetes. full-upgrade también puede eliminar para resolver conflictos (equivale a apt-get dist-upgrade).`,`sudo apt update && sudo apt full-upgrade`],
[`Instalar y actualizar`,`apt install y sus opciones`,`Instala también los paquetes recomendados. -s simula sin cambiar nada; ./archivo.deb instala uno local; paquete=versión fija la versión; --no-install-recommends omite recomendados; -t elige una suite concreta; reinstall repite la instalación.`,`sudo apt install -s nginx\nsudo apt install --no-install-recommends nginx`],
[`Instalar y actualizar`,`download y satisfy`,`download baja el .deb a la carpeta actual sin instalarlo. satisfy instala lo necesario para cumplir una expresión de dependencias.`,`apt download curl\nsudo apt satisfy 'curl (>= 7.0)'`],
[`Eliminar y limpiar`,`remove, purge y autoremove`,`remove deja los archivos de configuración; purge también los borra de /etc (no los datos de /home). autoremove quita dependencias automáticas que ya nadie necesita; con --purge borra también su configuración.`,`sudo apt purge nginx && sudo apt autoremove --purge`],
[`Eliminar y limpiar`,`clean y autoclean`,`clean vacía /var/cache/apt/archives. autoclean borra solo los .deb que ya no se pueden descargar. Liberan disco, no afectan a lo instalado.`,`sudo apt clean`],
[`Buscar e inspeccionar`,`search, show y list`,`search busca en nombres y descripciones (--names-only solo en nombres). show muestra versión, dependencias y tamaño. list admite --installed, --upgradable y --all-versions.`,`apt search --names-only ^openssh\napt show openssh-server\napt list --upgradable`],
[`Buscar e inspeccionar`,`policy, depends y rdepends`,`policy muestra versión instalada, candidata y la prioridad de cada repositorio. depends indica de qué depende un paquete y rdepends quién depende de él. apt-cache madison lista todas las versiones disponibles.`,`apt policy openssh-server\napt rdepends openssh-client`],
[`Buscar e inspeccionar`,`changelog y apt-file`,`changelog muestra el registro de cambios de un paquete. apt-file es un paquete aparte que busca qué paquete contiene un archivo, aunque no esté instalado.`,`apt changelog openssh-server\nsudo apt install apt-file && sudo apt-file update && apt-file search sshd_config`],
[`Retener y fijar versiones`,`apt-mark`,`hold impide que un paquete se actualice; unhold lo libera; showhold lista los retenidos. manual y auto cambian cómo se marca un paquete: autoremove solo quita los marcados como automáticos.`,`sudo apt-mark hold linux-image-amd64\napt-mark showhold`],
[`Retener y fijar versiones`,`Pinning (preferences)`,`En /etc/apt/preferences.d/ se asigna Pin-Priority por paquete o repositorio. Mayor a 1000 permite bajar de versión; 500 es lo normal; 100 es la versión ya instalada; negativo bloquea el paquete.`,`Package: openssh-server\nPin: release a=bookworm-backports\nPin-Priority: 600`],
[`Repositorios y fuentes`,`Formato clásico sources.list`,`Cada línea es deb URI suite componentes (deb-src para código fuente). Los componentes son main, contrib, non-free y, desde Debian 12, non-free-firmware. Usa el nombre en clave (bookworm) en vez de stable para no saltar de versión por sorpresa.`,`deb http://deb.debian.org/debian bookworm main non-free-firmware`],
[`Repositorios y fuentes`,`Formato deb822 (.sources)`,`Bloques con campos Types, URIs, Suites, Components y Signed-By, en /etc/apt/sources.list.d/. Es el formato recomendado en Debian 13; APT ya lo leía antes.`,`Types: deb\nURIs: https://deb.debian.org/debian\nSuites: trixie trixie-updates\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.pgp`],
[`Repositorios y fuentes`,`Suites y backports`,`Además de la suite principal existen codename-updates, codename-security (desde Debian 11) y codename-backports. Los backports no se instalan solos: se piden con -t.`,`sudo apt install -t bookworm-backports paquete`],
[`Repositorios y fuentes`,`edit-sources y modernize-sources`,`edit-sources abre las fuentes en tu editor y hace comprobaciones básicas. modernize-sources convierte las fuentes al formato deb822 y guarda copia .bak; llegó con APT 3.0 y no existe en Debian 12.`,`sudo apt edit-sources\nsudo apt modernize-sources`],

[`Auditoría`,`env_reset`,`Por defecto sudo limpia las variables de entorno del usuario para evitar inyección de librerías o cambios de ruta de binarios (PATH, LD_PRELOAD).`],
